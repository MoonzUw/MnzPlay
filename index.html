<!-- Botão de Configurações -->
<button id="mnz-cfg-btn" type="button"
  style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-size:13px;">
  <span>⚙</span>
  <span data-i18n="cfg_button">Configurações</span>
</button>

<!-- Modal de Configurações -->
<div id="mnz-cfg-modal"
  style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.72);align-items:center;justify-content:center;padding:16px;">
  <div style="width:100%;max-width:380px;background:#151221;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;color:#fff;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h3 style="margin:0;font-size:18px;" data-i18n="cfg_title">Configurações</h3>
      <button id="mnz-cfg-close-x" type="button"
        style="background:transparent;border:none;color:#cbd5e1;font-size:18px;cursor:pointer;">✕</button>
    </div>

    <label for="mnz-lang-select" style="display:block;font-size:12px;color:#cbd5e1;margin-bottom:6px;" data-i18n="lang_label">
      Idioma / Language
    </label>
    <select id="mnz-lang-select"
      style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.16);background:#0d0b14;color:#fff;margin-bottom:16px;font-size:14px;">
      <option value="pt-BR">Português (PT-BR)</option>
      <option value="en">English (EN)</option>
      <option value="es">Español (ES)</option>
    </select>

    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button id="mnz-cfg-cancel" type="button"
        style="padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#fff;cursor:pointer;"
        data-i18n="cancel">
        Cancelar
      </button>
      <button id="mnz-cfg-save" type="button"
        style="padding:8px 14px;border-radius:10px;border:none;background:#8b5cf6;color:#fff;font-weight:600;cursor:pointer;"
        data-i18n="save">
        Salvar
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  const LANG_KEY = 'mnzplay_idioma_v1';

  const TRADUCOES = {
    'pt-BR': {
      cfg_button: 'Configurações',
      cfg_title: 'Configurações',
      lang_label: 'Idioma / Language',
      cancel: 'Cancelar',
      save: 'Salvar',
      search_placeholder: 'Buscar Jogo...',
      tab_games: 'Jogos',
      tab_favorites: 'Favoritos',
      tab_recent: 'Recentes',
      tab_friends: 'Amigos',
      tab_achievements: 'Conquistas'
    },
    'en': {
      cfg_button: 'Settings',
      cfg_title: 'Settings',
      lang_label: 'Language / Idioma',
      cancel: 'Cancel',
      save: 'Save',
      search_placeholder: 'Search Game...',
      tab_games: 'Games',
      tab_favorites: 'Favorites',
      tab_recent: 'Recent',
      tab_friends: 'Friends',
      tab_achievements: 'Achievements'
    },
    'es': {
      cfg_button: 'Ajustes',
      cfg_title: 'Ajustes',
      lang_label: 'Idioma / Language',
      cancel: 'Cancelar',
      save: 'Guardar',
      search_placeholder: 'Buscar juego...',
      tab_games: 'Juegos',
      tab_favorites: 'Favoritos',
      tab_recent: 'Recientes',
      tab_friends: 'Amigos',
      tab_achievements: 'Logros'
    }
  };

  const btnOpen = document.getElementById('mnz-cfg-btn');
  const modal = document.getElementById('mnz-cfg-modal');
  const closeX = document.getElementById('mnz-cfg-close-x');
  const btnCancel = document.getElementById('mnz-cfg-cancel');
  const btnSave = document.getElementById('mnz-cfg-save');
  const selectLang = document.getElementById('mnz-lang-select');

  function getLang() {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && TRADUCOES[saved]) return saved;
    } catch (_) {}
    return 'pt-BR';
  }

  function aplicarIdioma(lang) {
    const dict = TRADUCOES[lang] || TRADUCOES['pt-BR'];
    document.documentElement.lang = lang;

    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });

    // Traduz abas e campo de busca existentes caso existam no DOM
    const mapTextos = {
      'Jogos': dict.tab_games,
      'Games': dict.tab_games,
      'Juegos': dict.tab_games,
      'Favoritos': dict.tab_favorites,
      'Favorites': dict.tab_favorites,
      'Recentes': dict.tab_recent,
      'Recent': dict.tab_recent,
      'Recientes': dict.tab_recent,
      'Amigos': dict.tab_friends,
      'Friends': dict.tab_friends,
      'Conquistas': dict.tab_achievements,
      'Achievements': dict.tab_achievements,
      'Logros': dict.tab_achievements
    };

    document.querySelectorAll('nav a, nav button, header a, header button, [role="tab"]').forEach((el) => {
      const txt = (el.textContent || '').trim();
      if (mapTextos[txt]) el.textContent = mapTextos[txt];
    });

    document.querySelectorAll('input[type="search"], input[placeholder*="Buscar"], input[placeholder*="Search"]').forEach((inp) => {
      inp.placeholder = dict.search_placeholder;
    });
  }

  async function salvarIdiomaNaNuvem(lang) {
    const client = window.supabaseClient || window.sb || window.supabase;
    if (!client || !client.auth || !client.from) return;
    try {
      const { data: { user } } = await client.auth.getUser();
      if (!user) return;
      await client.from('perfis').upsert({
        user_id: user.id,
        idioma: lang,
        atualizado_em: new Date().toISOString()
      }, { onConflict: 'user_id' });
    } catch (_) {}
  }

  btnOpen.addEventListener('click', () => {
    selectLang.value = getLang();
    modal.style.display = 'flex';
  });

  function fecharModal() {
    modal.style.display = 'none';
  }

  closeX.addEventListener('click', fecharModal);
  btnCancel.addEventListener('click', fecharModal);

  btnSave.addEventListener('click', async () => {
    const escolhido = selectLang.value;
    try { localStorage.setItem(LANG_KEY, escolhido); } catch (_) {}
    aplicarIdioma(escolhido);
    fecharModal();
    await salvarIdiomaNaNuvem(escolhido);
  });

  aplicarIdioma(getLang());
})();
</script>
