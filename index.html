<!-- Botão da foto de perfil na barra superior -->
<button id="mnz-avatar-btn" type="button" title="Escolher foto e editar perfil"
  style="display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-size:13px;">
  <img id="mnz-avatar-top-img" src="" alt="Foto de perfil"
    style="width:26px;height:26px;border-radius:50%;object-fit:cover;display:none;border:1px solid rgba(255,255,255,0.25);" />
  <span id="mnz-avatar-top-letter"
    style="width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#7c3aed;font-weight:700;font-size:12px;">M</span>
  <span id="mnz-avatar-top-name">Perfil</span>
</button>

<!-- Modal para o usuário escolher a própria foto -->
<div id="mnz-avatar-modal"
  style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.72);align-items:center;justify-content:center;padding:16px;">
  <div style="width:100%;max-width:360px;background:#151221;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;color:#fff;">
    <h3 style="margin:0 0 14px;font-size:18px;">Escolher foto de perfil</h3>

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
      <img id="mnz-avatar-prev-img" src="" alt="Pré-visualização"
        style="width:68px;height:68px;border-radius:50%;object-fit:cover;display:none;border:2px solid #8b5cf6;" />
      <div id="mnz-avatar-prev-letter"
        style="width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#7c3aed;font-size:24px;font-weight:700;">M</div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <label for="mnz-foto-file"
          style="background:#8b5cf6;color:#fff;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;">
          Escolher imagem
        </label>
        <input id="mnz-foto-file" type="file" accept="image/*" style="display:none;" />

        <button id="mnz-foto-remover" type="button"
          style="background:transparent;border:1px solid rgba(255,255,255,0.16);color:#cbd5e1;padding:6px 12px;border-radius:9px;font-size:12px;cursor:pointer;">
          Remover foto
        </button>
      </div>
    </div>

    <label for="mnz-perfil-nome" style="display:block;font-size:12px;color:#cbd5e1;margin-bottom:5px;">Nome exibido</label>
    <input id="mnz-perfil-nome" type="text" maxlength="24" placeholder="Seu nome"
      style="width:100%;box-sizing:border-box;padding:9px 11px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:#0d0b14;color:#fff;margin-bottom:16px;" />

    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button id="mnz-avatar-cancelar" type="button"
        style="padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#fff;cursor:pointer;">
        Cancelar
      </button>
      <button id="mnz-avatar-salvar" type="button"
        style="padding:8px 14px;border-radius:10px;border:none;background:#8b5cf6;color:#fff;font-weight:600;cursor:pointer;">
        Guardar
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  const CHAVE_LOCAL = 'mnzplay_foto_perfil_v1';

  const btnAbrir = document.getElementById('mnz-avatar-btn');
  const topImg = document.getElementById('mnz-avatar-top-img');
  const topLetter = document.getElementById('mnz-avatar-top-letter');
  const topName = document.getElementById('mnz-avatar-top-name');

  const modal = document.getElementById('mnz-avatar-modal');
  const prevImg = document.getElementById('mnz-avatar-prev-img');
  const prevLetter = document.getElementById('mnz-avatar-prev-letter');
  const inputFile = document.getElementById('mnz-foto-file');
  const btnRemover = document.getElementById('mnz-foto-remover');
  const inputNome = document.getElementById('mnz-perfil-nome');
  const btnCancelar = document.getElementById('mnz-avatar-cancelar');
  const btnGuardar = document.getElementById('mnz-avatar-salvar');

  let dados = { nome: 'Perfil', foto: '' };
  let rascunho = { nome: 'Perfil', foto: '' };

  function lerLocal() {
    try {
      const salvo = localStorage.getItem(CHAVE_LOCAL);
      if (salvo) dados = { ...dados, ...JSON.parse(salvo) };
    } catch (_) {}
  }

  function aplicarVisual(imgEl, letterEl, nome, foto) {
    letterEl.textContent = ((nome || 'P').trim().charAt(0) || 'P').toUpperCase();
    if (foto) {
      imgEl.src = foto;
      imgEl.style.display = imgEl === topImg ? 'inline-block' : 'block';
      letterEl.style.display = 'none';
    } else {
      imgEl.removeAttribute('src');
      imgEl.style.display = 'none';
      letterEl.style.display = imgEl === topImg ? 'inline-flex' : 'flex';
    }
  }

  function atualizarTudo() {
    topName.textContent = dados.nome || 'Perfil';
    aplicarVisual(topImg, topLetter, dados.nome, dados.foto);
    aplicarVisual(prevImg, prevLetter, rascunho.nome, rascunho.foto);
  }

  function processarImagem(ficheiro, tamanhoMax = 160, qualidade = 0.78) {
    return new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onload = () => {
        const img = new Image();
        img.onload = () => {
          let largura = img.width;
          let altura = img.height;
          if (largura > altura) {
            if (largura > tamanhoMax) {
              altura = Math.round((altura * tamanhoMax) / largura);
              largura = tamanhoMax;
            }
          } else if (altura > tamanhoMax) {
            largura = Math.round((largura * tamanhoMax) / altura);
            altura = tamanhoMax;
          }
          const tela = document.createElement('canvas');
          tela.width = largura;
          tela.height = altura;
          const ctx = tela.getContext('2d');
          ctx.drawImage(img, 0, 0, largura, altura);
          resolve(tela.toDataURL('image/jpeg', qualidade));
        };
        img.onerror = reject;
        img.src = leitor.result;
      };
      leitor.onerror = reject;
      leitor.readAsDataURL(ficheiro);
    });
  }

  async function sincronizarPerfis() {
    const cliente = window.supabaseClient || window.sb || window.supabase;
    if (!cliente || !cliente.auth || !cliente.from) return;
    try {
      const { data: { user } } = await cliente.auth.getUser();
      if (!user) return;
      await cliente.from('perfis').upsert({
        user_id: user.id,
        nome_exibicao: dados.nome,
        avatar_url: dados.foto || null,
        atualizado_em: new Date().toISOString()
      }, { onConflict: 'user_id' });
    } catch (_) {}
  }

  btnAbrir.addEventListener('click', () => {
    rascunho = { ...dados };
    inputNome.value = rascunho.nome;
    inputFile.value = '';
    aplicarVisual(prevImg, prevLetter, rascunho.nome, rascunho.foto);
    modal.style.display = 'flex';
  });

  btnCancelar.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  inputFile.addEventListener('change', async (e) => {
    const ficheiro = e.target.files && e.target.files[0];
    if (!ficheiro) return;
    rascunho.foto = await processarImagem(ficheiro);
    aplicarVisual(prevImg, prevLetter, rascunho.nome, rascunho.foto);
  });

  btnRemover.addEventListener('click', () => {
    rascunho.foto = '';
    inputFile.value = '';
    aplicarVisual(prevImg, prevLetter, rascunho.nome, rascunho.foto);
  });

  inputNome.addEventListener('input', () => {
    rascunho.nome = inputNome.value;
    aplicarVisual(prevImg, prevLetter, rascunho.nome, rascunho.foto);
  });

  btnGuardar.addEventListener('click', async () => {
    dados = {
      nome: (inputNome.value || 'Perfil').trim() || 'Perfil',
      foto: rascunho.foto || ''
    };
    localStorage.setItem(CHAVE_LOCAL, JSON.stringify(dados));
    atualizarTudo();
    modal.style.display = 'none';
    await sincronizarPerfis();
  });

  lerLocal();
  atualizarTudo();
})();
</script>
