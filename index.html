<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07040c">
<title>MnzPlay</title>
<style>
:root {
  --bg: #07040c;
  --bg-2: #0e0817;
  --surface: #1a1026;
  --surface-2: #241638;
  --border: #35214f;
  --accent: #a855f7;
  --accent-2: #c084fc;
  --glow: rgba(168, 85, 247, .45);
  --text: #f3ecff;
  --muted: #9a8bb3;
  --ok: #4ade80;
  --warn: #facc15;
  --err: #f87171;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(124, 58, 237, .25), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgba(168, 85, 247, .12), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* Barra de sistema */
.system-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 18px;
  padding: 12px 28px;
  background: rgba(10, 6, 16, .85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 36px; height: 36px; border-radius: 11px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #5b21b6, #c084fc);
  box-shadow: 0 0 16px var(--glow);
}
.logo-text { font-size: 1.3rem; font-weight: 600; letter-spacing: .5px; }
.logo-text b { color: var(--accent-2); font-weight: 800; }
.tabs { display: flex; gap: 4px; margin: 0 auto; }
.tab {
  background: none; border: 0; padding: 9px 18px; border-radius: 999px;
  color: var(--muted); font-weight: 600; transition: .15s;
}
.tab:hover { color: var(--text); background: var(--surface); }
.tab.active { color: #fff; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent), 0 0 14px var(--glow); }
.tab:focus-visible, .chip:focus-visible, .btn:focus-visible, .sync:focus-visible, .pad-pill:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; flex-wrap: wrap; }
.counter { padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--accent-2); font-weight: 600; white-space: nowrap; }
.clock { font-variant-numeric: tabular-nums; }

.pad-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: .82rem; font-weight: 600;
  transition: .15s;
}
.pad-pill.connected { color: var(--text); border-color: rgba(74, 222, 128, .45); }
.pad-pill.connected .pad-led { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.pad-led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }

/* Botão de conta / status de sincronização */
.sync {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: .85rem; font-weight: 600; transition: .15s;
}
.sync:hover { border-color: var(--accent-2); box-shadow: 0 0 12px var(--glow); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
[data-sync="saved"] .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
[data-sync="syncing"] .dot { background: var(--warn); animation: blink 1s ease-in-out infinite; }
[data-sync="error"] .dot { background: var(--err); box-shadow: 0 0 8px var(--err); }
@keyframes blink { 50% { opacity: .3; } }

/* Busca e filtros */
.toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 20px 28px 4px; }
.search {
  display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 420px;
  padding: 0 14px; height: 42px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; color: var(--muted); transition: .15s;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); color: var(--accent-2); }
.search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
.systems { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 9px 16px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--border); color: var(--muted); font-weight: 600; font-size: .9rem; transition: .15s;
}
.chip:hover { color: var(--text); border-color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #12061f; box-shadow: 0 0 14px var(--glow); }

/* Grid e mídia física 3D (frente e verso) */
main { flex: 1; padding: 20px 28px 28px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; }
.card {
  position: relative; display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: visible; cursor: pointer; outline: 0;
  perspective: 1100px;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
body.no-anim .card,
body.no-anim .card:hover,
body.no-anim .card:focus-visible,
body.no-anim .card-inner,
body.no-anim .cover-face img { transition: none; }

.card:hover, .card:focus-visible {
  transform: translateY(-4px) scale(1.03);
  border-color: var(--accent-2);
  box-shadow: 0 0 0 2px var(--accent), 0 10px 30px var(--glow);
}

.cover {
  position: relative; aspect-ratio: 3 / 4; background: #08040e;
  border-radius: var(--radius) var(--radius) 0 0;
  border-bottom: 3px solid #0a0610;
  perspective: 1100px;
}

.card-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.22, .8, .25, 1);
  border-radius: inherit;
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.cover-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: inherit; overflow: hidden;
}
.cover-front { background: #08040e; }
.cover-front::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(7, 4, 12, .22) 0%, transparent 32%, rgba(7, 4, 12, .52) 100%);
}
.cover-front img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; transition: transform .25s ease; }
.card:not(.flipped):hover .cover-front img,
.card:not(.flipped):focus-visible .cover-front img { transform: scale(1.04); }

.cover-front.placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 16px; text-align: center; color: rgba(255,255,255,.92);
  background:
    radial-gradient(circle at 50% 38%, rgba(255,255,255,.16), transparent 62%),
    linear-gradient(145deg, hsl(var(--h) 62% 24%), hsl(calc(var(--h) + 42) 72% 11%));
}
.cover-front.placeholder .ph-mono {
  width: 68px; height: 68px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1.55rem; font-weight: 800; letter-spacing: .5px;
  background: rgba(10, 6, 16, .45);
  border: 2px solid rgba(255,255,255,.25);
  box-shadow: 0 8px 20px rgba(0,0,0,.35);
}
.cover-front.placeholder .ph-sub {
  font-size: .72rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: rgba(255,255,255,.72);
}

/* Parte de trás da mídia física */
.cover-back {
  transform: rotateY(180deg);
  background: linear-gradient(180deg, #1b1029 0%, #0d0716 100%);
  display: flex; flex-direction: column; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.cover-back img.back-photo {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
.back-header {
  position: relative; z-index: 1;
  padding: 8px 10px;
  background: linear-gradient(90deg, #5b21b6, #9333ea);
  color: #fff; font-size: .68rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center;
}
.back-body {
  position: relative; z-index: 1;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 4px);
}
.back-title { font-size: .84rem; font-weight: 700; color: var(--accent-2); line-height: 1.2; }
.back-desc { font-size: .72rem; color: var(--muted); line-height: 1.38; flex: 1; overflow: hidden; }
.back-specs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  font-size: .66rem; color: var(--text);
}
.back-spec {
  padding: 4px 6px; border-radius: 6px;
  background: rgba(10, 6, 16, .75); border: 1px solid rgba(168, 85, 247, .25);
}
.back-spec b { display: block; color: var(--muted); font-weight: 600; font-size: .58rem; text-transform: uppercase; }
.back-footer {
  position: relative; z-index: 1;
  padding: 7px 10px; border-top: 1px solid var(--border);
  background: rgba(8, 4, 14, .85);
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  font-size: .65rem; color: var(--muted);
}
.back-launch {
  padding: 4px 9px; border-radius: 6px; border: 0;
  background: var(--accent); color: #12061f; font-weight: 800; font-size: .68rem;
}

.badge {
  position: absolute; top: 10px; left: 10px; z-index: 3; padding: 3px 9px; border-radius: 6px;
  font-size: .72rem; font-weight: 800; letter-spacing: .5px;
  background: rgba(10, 6, 16, .85); color: var(--accent-2); border: 1px solid var(--accent);
}
.card-actions {
  position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 6px;
}
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font-size: .95rem;
  background: rgba(10, 6, 16, .84); border: 1px solid var(--border); color: var(--muted); transition: .15s;
}
.icon-btn:hover { color: #fff; border-color: var(--accent-2); }
.fav.on { color: #ff6bd6; border-color: #ff6bd6; box-shadow: 0 0 10px rgba(255,107,214,.5); }
.flip-btn.on { color: var(--accent-2); border-color: var(--accent-2); background: rgba(88, 28, 135, .75); }

.info { padding: 12px 14px 14px; border-radius: 0 0 var(--radius) var(--radius); background: inherit; }
.info h3 { font-size: .98rem; line-height: 1.25; margin-bottom: 4px; }
.info span { font-size: .8rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 70px 0; font-size: 1.05rem; }
.empty strong { display: block; color: var(--text); font-size: 1.2rem; margin-bottom: 6px; }

/* Aba Amigos estilo Steam */
.steam-layout {
  max-width: 1120px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(300px, .85fr);
  gap: 20px;
  align-items: start;
}
.steam-panel {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 12px 36px rgba(0, 0, 0, .35);
}
.steam-me {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding: 16px 20px;
  background: linear-gradient(90deg, rgba(91, 33, 182, .35), rgba(14, 8, 23, .9));
  border-bottom: 1px solid var(--border);
}
.steam-me-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.steam-avatar-wrap { position: relative; flex: none; }
.steam-avatar {
  width: 50px; height: 50px; border-radius: 12px;
  display: grid; place-items: center; font-weight: 800; font-size: 1.15rem;
  background: linear-gradient(135deg, #5b21b6, #c084fc); color: #fff;
  border: 2px solid rgba(192, 132, 252, .45);
}
.steam-state-dot {
  position: absolute; right: -3px; bottom: -3px;
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--bg-2); background: var(--muted);
}
.steam-state-dot.online { background: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, .7); }
.steam-state-dot.ingame { background: var(--ok); box-shadow: 0 0 8px rgba(74, 222, 128, .8); }
.steam-state-dot.away { background: var(--warn); }
.steam-me-info h2 { font-size: 1.08rem; line-height: 1.25; }
.steam-me-sub { font-size: .84rem; color: var(--muted); margin-top: 2px; }
.steam-me-sub.ingame { color: var(--ok); font-weight: 700; }
.steam-me-sub.online { color: #7dd3fc; font-weight: 600; }
.steam-me-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.steam-presence-sel {
  padding: 7px 11px; border-radius: 10px;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text); font-size: .84rem; font-weight: 600;
}

.steam-toolbar {
  display: flex; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  background: rgba(14, 8, 23, .55);
}
.steam-filter-input {
  flex: 1 1 190px; padding: 9px 12px; border-radius: 10px; outline: 0;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text); font-size: .88rem;
}
.steam-filter-input:focus, .steam-add-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.steam-add-form { display: flex; gap: 8px; flex: 1.4 1 250px; }
.steam-add-input {
  flex: 1; padding: 9px 12px; border-radius: 10px; outline: 0;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text); font-size: .88rem;
}

.steam-groups { padding: 12px 16px 18px; display: grid; gap: 14px; }
.steam-group-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: .78rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); padding: 4px 6px;
}
.steam-group-title.ingame { color: var(--ok); }
.steam-group-title.online { color: #7dd3fc; }
.steam-group-list { list-style: none; display: grid; gap: 6px; }

.steam-friend {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px; border-radius: 12px;
  background: rgba(14, 8, 23, .78); border: 1px solid var(--border);
  transition: .14s;
}
.steam-friend:hover { border-color: var(--accent); background: rgba(36, 22, 56, .85); }
.steam-friend.ingame { border-color: rgba(74, 222, 128, .38); background: linear-gradient(90deg, rgba(22, 101, 52, .18), rgba(14, 8, 23, .85)); }
.steam-friend-main { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; cursor: pointer; }
.steam-friend-av {
  position: relative; width: 38px; height: 38px; border-radius: 9px; flex: none;
  display: grid; place-items: center; font-weight: 800; font-size: .92rem;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--accent-2);
}
.steam-friend-av .steam-state-dot { width: 11px; height: 11px; right: -2px; bottom: -2px; }
.steam-friend-text { min-width: 0; flex: 1; }
.steam-friend-name { font-size: .94rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steam-friend-status { font-size: .78rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steam-friend-status.ingame { color: var(--ok); font-weight: 700; }
.steam-friend-status.online { color: #7dd3fc; }
.steam-friend-actions { display: flex; gap: 6px; flex: none; }

/* Painel de Chat estilo Steam */
.steam-chat {
  display: flex; flex-direction: column; min-height: 430px; max-height: 620px;
}
.steam-chat-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  background: rgba(14, 8, 23, .75);
}
.steam-chat-who strong { display: block; font-size: .96rem; }
.steam-chat-who small { display: block; font-size: .76rem; color: var(--muted); margin-top: 2px; }
.steam-chat-who small.ingame { color: var(--ok); font-weight: 700; }
.steam-chat-log {
  flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  background: rgba(7, 4, 12, .45);
}
.chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: .86rem; max-width: 240px; line-height: 1.45; }
.chat-msg {
  max-width: 82%; padding: 9px 12px; border-radius: 12px; font-size: .88rem; line-height: 1.4;
  background: var(--bg-2); border: 1px solid var(--border);
}
.chat-msg.me {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(126, 34, 206, .55), rgba(88, 28, 135, .65));
  border-color: rgba(192, 132, 252, .45);
}
.chat-msg time { display: block; font-size: .68rem; color: var(--muted); margin-top: 4px; text-align: right; }
.steam-chat-form {
  display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border);
  background: rgba(14, 8, 23, .8);
}
.steam-chat-input {
  flex: 1; padding: 9px 12px; border-radius: 10px; outline: 0;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text); font-size: .9rem;
}
.steam-chat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.steam-fb { padding: 0 20px 14px; font-size: .84rem; min-height: 0; }

/* Conquistas */
.soon {
  max-width: 560px; margin: 30px auto; text-align: center; padding: 44px 32px; border-radius: 20px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border); box-shadow: 0 0 60px rgba(124, 58, 237, .18);
}
.soon-trophy { color: var(--accent-2); filter: drop-shadow(0 0 14px var(--glow)); animation: float 3s ease-in-out infinite; }
.soon-badge {
  display: inline-block; margin: 14px 0 10px; padding: 5px 14px; border-radius: 999px;
  background: var(--accent); color: #12061f; font-weight: 800; font-size: .8rem; letter-spacing: 1px; text-transform: uppercase;
}
.soon h2 { font-size: 1.6rem; margin-bottom: 10px; }
.soon p { color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
.soon-list { list-style: none; display: grid; gap: 10px; margin-bottom: 26px; text-align: left; }
.soon-list li { display: flex; gap: 12px; align-items: center; padding: 11px 14px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; }
.soon-progress { height: 8px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border); overflow: hidden; margin-bottom: 8px; }
.soon-progress i { display: block; width: 45%; height: 100%; background: linear-gradient(90deg, #7c3aed, #c084fc); box-shadow: 0 0 12px var(--glow); animation: pulse 2s ease-in-out infinite; }
.soon small { color: var(--muted); }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes pulse { 50% { opacity: .6; } }

/* Dicas */
.hints {
  display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 12px;
  color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); background: var(--bg-2);
}
kbd {
  display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 3px; text-align: center;
  border-radius: 5px; font: inherit; font-size: .75rem; background: var(--surface);
  border: 1px solid var(--border); border-bottom-width: 2px; color: var(--text);
}

/* Player */
.player { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: #000; }
.player-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: linear-gradient(180deg, #160a26, #0a0610); border-bottom: 1px solid var(--border);
}
.player-title { flex: 1; text-align: center; font-weight: 600; color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: .9rem; background: var(--surface-2); border: 1px solid v
